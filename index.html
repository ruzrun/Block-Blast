<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Block Burst 🧱</title>

    <link rel="stylesheet" href="block.css">
</head>

<body>

    <button id="musicButton" class="music-button"> 🎵 Music On </button>

    <div class="game-container">

        <h1>Block Burst 🧱</h1>

        <p class="subtitle">
            Build your streak ✨
        </p>

        <div class="score-board">

            <div>
                Score
                <span id="score">0</span>
            </div>

            <div>
                Combo
                <span id="combo">0</span>
            </div>

        </div>

        <div id="gameBoard"></div>

        <p id="gameMessage">
            Choose a block 💕
        </p>

        <div id="pieceContainer"></div>

        <button id="restartButton">
            Restart Game 🔄
        </button>

        <a
            href="https://ruzrun.github.io/arcade-game/"
            class="back-button">
            🎮 Arcade
        </a>

    </div>

    <script src="block.js"></script>

</body>
</html>
